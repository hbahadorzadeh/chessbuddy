name: Diagnose public MCP scan transport
on:
  push:
    branches: ['submission/**']
    paths:
      - 'scripts/diagnose-mcp-scan.mjs'
      - '.github/workflows/diagnose-mcp-scan.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Diagnose anonymous MCP HTTP transport
        run: node scripts/diagnose-mcp-scan.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mcp-scan-diagnostics
          path: dist/mcp-scan-diagnostics.json
          if-no-files-found: error
          retention-days: 30
